name: V2 LAN Candidate Build (Diagnostic Artifact)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v2-lan-candidate.yml'

permissions:
  contents: read

concurrency:
  group: v2-lan-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lan-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Record candidate
        run: |
          echo "Candidate: sansaks-jpg/NarutoSenki-V2"
          echo "Pinned revision: 1751b7fb8f05a96ff6e85bc8a6c8e3fdcca3f74a"
          echo "This is a diagnostic candidate build, not an integrated final game."

      - name: Fetch pinned V2 source
        run: |
          git clone https://github.com/sansaks-jpg/NarutoSenki-V2.git /tmp/narutosenki-lan-candidate
          cd /tmp/narutosenki-lan-candidate
          git checkout --detach 1751b7fb8f05a96ff6e85bc8a6c8e3fdcca3f74a
          test "$(git rev-parse HEAD)" = "1751b7fb8f05a96ff6e85bc8a6c8e3fdcca3f74a"
          test -f projects/NarutoSenki/proj.android-studio/gradlew
          test -f projects/NarutoSenki/proj.android-studio/app/build.gradle
          test -d projects/NarutoSenki/Classes
          test -d projects/NarutoSenki/Resources

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: gradle

      - name: Install legacy NDK runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libtinfo5

      - name: Cache Android NDK r17c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/android-ndk-r17c
          key: ndk-r17c-linux-x86_64

      - name: Download Android NDK r17c
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo /tmp/android-ndk-r17c.zip https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          sudo unzip -q /tmp/android-ndk-r17c.zip -d /usr/local
          sudo chown -R "$USER:$USER" /usr/local/android-ndk-r17c
          rm -f /tmp/android-ndk-r17c.zip

      - name: Configure legacy Android SDK and NDK
        working-directory: /tmp/narutosenki-lan-candidate/projects/NarutoSenki/proj.android-studio
        run: |
          printf 'sdk.dir=%s\nndk.dir=/usr/local/android-ndk-r17c\n' "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          chmod +x ./gradlew
          sed -i 's/NDK_TOOLCHAIN_VERSION=4.9/NDK_TOOLCHAIN_VERSION=clang/g' app/build.gradle

      - name: Build V2 LAN candidate APK
        working-directory: /tmp/narutosenki-lan-candidate/projects/NarutoSenki/proj.android-studio
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify candidate APK
        run: |
          set -euo pipefail
          find /tmp/narutosenki-lan-candidate/projects/NarutoSenki/proj.android-studio -type f -name '*.apk' -print
          test -n "$(find /tmp/narutosenki-lan-candidate/projects/NarutoSenki/proj.android-studio -type f -name '*.apk' -print -quit)"

      - name: Upload candidate APK for private testing
        uses: actions/upload-artifact@v4
        with:
          name: naruto-senki-v2-lan-candidate-apk
          path: /tmp/narutosenki-lan-candidate/projects/NarutoSenki/proj.android-studio/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print diagnostics on failure
        if: failure()
        run: |
          echo "Inspect the Gradle/NDK error above before modifying the candidate."
          find /tmp/narutosenki-lan-candidate/projects/NarutoSenki/proj.android-studio -type f \( -name '*.log' -o -name 'hs_err_pid*.log' \) -print 2>/dev/null || true
