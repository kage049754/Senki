name: V2 Source Candidate Build (Private Testing Artifact)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v2-source-smoke.yml'
      - 'patches/android-clean/**'
      - 'artwork/**'

permissions:
  contents: read

concurrency:
  group: v2-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v2-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Record target and pinned source revision
        run: |
          echo "This is a technical smoke test of an external V2-derived candidate."
          echo "It is NOT the integrated/final game build."
          echo "Candidate: muhammadadilsyaputra08-alt/NarutoSenki-Custom"
          echo "Pinned revision: 279e85e73040558c84988a0eea310b6286eb77f0"
          echo "Local patch series: patches/android-clean/*.patch"
          echo "The diagnostic APK will be retained as a short-lived Actions artifact for private testing; this is not a public release."

      - name: Fetch pinned candidate into temporary runner workspace
        run: |
          git clone https://github.com/muhammadadilsyaputra08-alt/NarutoSenki-Custom.git /tmp/narutosenki-candidate
          cd /tmp/narutosenki-candidate
          git checkout --detach 279e85e73040558c84988a0eea310b6286eb77f0
          test "$(git rev-parse HEAD)" = "279e85e73040558c84988a0eea310b6286eb77f0"
          test -f projects/NarutoSenki/proj.android-studio/gradlew
          test -f projects/NarutoSenki/proj.android-studio/app/build.gradle
          test -d projects/NarutoSenki/Classes
          test -d projects/NarutoSenki/Resources
          echo "Pinned source and expected Android project structure verified."

      - name: Apply central Senki patches
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t patches < <(find "$GITHUB_WORKSPACE/patches/android-clean" -maxdepth 1 -type f -name '*.patch' -print | sort)
          if [[ ${#patches[@]} -eq 0 ]]; then
            echo "No local patches found; refusing to build an unmodified candidate by accident."
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Checking and applying $patch"
            git -C /tmp/narutosenki-candidate apply --check "$patch"
            git -C /tmp/narutosenki-candidate apply "$patch"
          done
          echo "All central Senki patches applied."

      - name: Render central Senki artwork
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          ART="$GITHUB_WORKSPACE/artwork"
          GAME="/tmp/narutosenki-candidate/projects/NarutoSenki"
          APPRES="$GAME/proj.android-studio/app/res"
          rsvg-convert -w 1280 -h 720 "$ART/senki-loading.svg" -o "$GAME/Resources/senki_loading.png"
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            dir="$APPRES/mipmap-$density"
            test -d "$dir"
            rsvg-convert -w "$size" -h "$size" "$ART/senki-launcher.svg" -o "$dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" "$ART/senki-launcher.svg" -o "$dir/ic_launcher_round.png"
          done
          for entry in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            dir="$APPRES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" "$ART/senki-launcher-foreground.svg" -o "$dir/ic_launcher_foreground.png"
          done
          test -s "$GAME/Resources/senki_loading.png"
          test -s "$APPRES/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$APPRES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          file "$GAME/Resources/senki_loading.png" "$APPRES/mipmap-xxxhdpi/ic_launcher.png" "$APPRES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          echo "Rendered the editable loading screen and launcher icon into the candidate source tree."

      - name: Set up Java 17 for Android SDK provisioning
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned legacy Android SDK and NDK into an isolated SDK root
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          CLEAN_ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$CLEAN_ANDROID_HOME"
          yes | "$SDKMANAGER" --sdk_root="$CLEAN_ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$CLEAN_ANDROID_HOME" "platforms;android-31" "build-tools;31.0.0" "platform-tools" "ndk;21.4.7075529"
          echo "ANDROID_HOME=$CLEAN_ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CLEAN_ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Installed only the pinned legacy SDK packages into an isolated root to avoid incompatible preinstalled platform metadata."

      - name: Configure SDK and NDK paths
        working-directory: /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/21.4.7075529\n' "$ANDROID_HOME" "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Set up Java 8 for legacy Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Build V2 candidate (diagnostic only)
        working-directory: /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify candidate APK exists
        if: success()
        run: |
          find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print
          test -n "$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          echo "Candidate APK exists and will be uploaded as a private-testing Actions artifact."

      - name: Verify patched package identity in APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/31.0.0/aapt" dump badging "$APK" | tee /tmp/senki-apk-badging.txt
          grep -F "name='com.senki.naruto.mod' versionCode='3' versionName='2.1.0-mod'" /tmp/senki-apk-badging.txt
          grep -F "application-label:'Naruto Senki Mod'" /tmp/senki-apk-badging.txt

      - name: Upload candidate debug APK for private testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-senki-v2-candidate-debug-apk
          path: /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print build diagnostics on failure
        if: failure()
        run: |
          echo "Build failed. Inspect Gradle/NDK error above before changing the pinned candidate."
          find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f \( -name '*.log' -o -name 'hs_err_pid*.log' \) -print 2>/dev/null || true
