name: V2 Source Candidate Build (Private Testing Artifact)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/v2-source-smoke.yml'
      - 'patches/android-clean/**'
      - 'scripts/**'
      - 'artwork/**'

permissions:
  contents: read

concurrency:
  group: v2-source-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-v2-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration repository
        uses: actions/checkout@v4

      - name: Record target and pinned source revision
        run: |
          echo "This is a technical smoke test of an external V2-derived candidate."
          echo "It is NOT the integrated/final game build."
          echo "Candidate: muhammadadilsyaputra08-alt/NarutoSenki-Custom"
          echo "Pinned revision: 279e85e73040558c84988a0eea310b6286eb77f0"
          echo "Local patch series: patches/android-clean/*.patch"
          echo "The diagnostic APK will be retained as a short-lived Actions artifact for private testing; this is not a public release."

      - name: Fetch pinned candidate into temporary runner workspace
        run: |
          git clone https://github.com/muhammadadilsyaputra08-alt/NarutoSenki-Custom.git /tmp/narutosenki-candidate
          cd /tmp/narutosenki-candidate
          git checkout --detach 279e85e73040558c84988a0eea310b6286eb77f0
          test "$(git rev-parse HEAD)" = "279e85e73040558c84988a0eea310b6286eb77f0"
          test -f projects/NarutoSenki/proj.android-studio/gradlew
          test -f projects/NarutoSenki/proj.android-studio/app/build.gradle
          test -d projects/NarutoSenki/Classes
          test -d projects/NarutoSenki/Resources
          echo "Pinned source and expected Android project structure verified."

      - name: Apply central Senki patches
        shell: bash
        run: |
          set -euo pipefail
          # Keep the game's original main-menu and character-selection backgrounds.
          # Explicitly exclude the retired custom-background patches.
          mapfile -t patches < <(find "$GITHUB_WORKSPACE/patches/android-clean" -maxdepth 1 -type f -name '*.patch' ! -name '0004-custom-character-select-background.patch' ! -name '0005-custom-main-menu-background.patch' -print | sort)
          if [[ ${#patches[@]} -eq 0 ]]; then
            echo "No local patches found; refusing to build an unmodified candidate by accident."
            exit 1
          fi
          for patch in "${patches[@]}"; do
            echo "Checking and applying $patch"
            if ! git -C /tmp/narutosenki-candidate apply --check "$patch"; then
              echo "Patch context failure for $patch; printing nearby source for diagnosis."
              if [[ "$patch" == *0008-dynamic-roster-pagination.patch ]]; then
                grep -n -A18 -B5 'self.pageNum' /tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SelectLayer.lua || true
                grep -n -A20 -B5 'local page_btn' /tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SelectLayer.lua || true
              fi
              exit 1
            fi
            git -C /tmp/narutosenki-candidate apply "$patch"
          done
          echo "All central Senki patches applied."

      - name: Apply character search/filter enhancement
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply_character_search.py" /tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SelectLayer.lua

      - name: Apply missing skill-description fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/apply_skill_label_fallback.py" /tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SkillLayer.lua
          python3 "$GITHUB_WORKSPACE/scripts/test_skill_label_fallback.py" /tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SkillLayer.lua

      - name: Add existing native forms to roster page four
        shell: bash
        run: |
          set -euo pipefail
          GAME=/tmp/narutosenki-candidate/projects/NarutoSenki
          python3 "$GITHUB_WORKSPACE/scripts/apply_selectable_forms.py" "$GAME"
          python3 "$GITHUB_WORKSPACE/scripts/test_selectable_forms.py" "$GAME"

      - name: Validate patched Lua scripts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1 python3-pil
          GAME=/tmp/narutosenki-candidate/projects/NarutoSenki
          test -s "$GAME/lua/ui/SelectLayer.lua"
          find "$GAME/lua" -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p
          echo "All game Lua scripts parse successfully, including the patched character-selection UI."

      - name: Generate image-based pagination buttons for pages 4+
        shell: bash
        run: |
          set -euo pipefail
          GAME=/tmp/narutosenki-candidate/projects/NarutoSenki
          python3 "$GITHUB_WORKSPACE/scripts/generate_page_button_assets.py" "$GAME/Resources"
          test -s "$GAME/Resources/senki_page4_off.png"
          test -s "$GAME/Resources/senki_page4_on.png"
          test -s "$GAME/Resources/senki_page5_off.png"
          test -s "$GAME/Resources/senki_page5_on.png"
          file "$GAME/Resources/senki_page4_off.png" "$GAME/Resources/senki_page4_on.png" "$GAME/Resources/senki_page5_off.png" "$GAME/Resources/senki_page5_on.png"

      - name: Verify generated pagination buttons preserve original artwork
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/test_page_button_assets.py" /tmp/narutosenki-candidate/projects/NarutoSenki/Resources

      - name: Audit every selectable character package
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/audit_character_packages.py" \
            /tmp/narutosenki-candidate/projects/NarutoSenki \
            "$GITHUB_WORKSPACE/character-package-audit.md"
          sed -n '1,55p' "$GITHUB_WORKSPACE/character-package-audit.md"
          grep -F "Kill-feed portrait frames" "$GITHUB_WORKSPACE/character-package-audit.md"
          grep -F "Kill-feed portrait atlas coverage:" "$GITHUB_WORKSPACE/character-package-audit.md"
          grep -E "^\\| Kabuto \\|.*\\| 2/2 \\|" "$GITHUB_WORKSPACE/character-package-audit.md"
          grep -E "^\\| Kiba \\|.*\\| 2/2 \\|" "$GITHUB_WORKSPACE/character-package-audit.md"

      - name: Validate character audit report structure
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/test_character_package_audit.py" "$GITHUB_WORKSPACE/character-package-audit.md"

      - name: Test character search/filter behavior
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/test_character_search.py" /tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SelectLayer.lua

      - name: Verify visible startup failure diagnostics
        shell: bash
        run: |
          set -euo pipefail
          MAIN=/tmp/narutosenki-candidate/projects/NarutoSenki/lua/main.lua
          grep -F "local function showStartupFailure(err)" "$MAIN"
          grep -F "require 'config'" "$MAIN"
          grep -F "if not ok then" "$MAIN"
          grep -F "director:runWithScene(scene)" "$MAIN"
          python3 - "$MAIN" <<'PY'
          import sys
          text = open(sys.argv[1], encoding="utf-8").read()
          require_line = text.index("require 'config'")
          protected_start = text.index("local function boot()")
          assert protected_start < require_line, "config load must be inside protected boot()"
          assert "xpcall(boot" in text, "startup must use xpcall"
          assert "showStartupFailure(err)" in text, "failed startup must trigger visible diagnostics"
          print("Startup config load is protected and a diagnostic screen is wired to boot failures.")
          PY

      - name: Verify dynamic character pagination
        shell: bash
        run: |
          set -euo pipefail
          SELECT=/tmp/narutosenki-candidate/projects/NarutoSenki/lua/ui/SelectLayer.lua
          grep -F 'self.pageNum = math.max(1, math.ceil(#charactersList / 21))' "$SELECT"
          grep -F 'ui.newImageMenuItem' "$SELECT"
          grep -F 'if i <= 3 then' "$SELECT"
          grep -F "senki_page' .. tostring(i) .. '_off.png" "$SELECT"
          grep -F "senki_page' .. tostring(i) .. '_on.png" "$SELECT"
          grep -F 'self.currentPage = index' "$SELECT"
          if grep -F 'ui.newTTFLabelMenuItem' "$SELECT"; then
            echo "Text-only pagination controls remain; all page controls must be image-based."
            exit 1
          fi
          if grep -F 'self.pageNum = 3' "$SELECT"; then
            echo "Fixed three-page roster cap remains in SelectLayer.lua."
            exit 1
          fi
          echo "Roster page count is dynamic. Pages 1-3 retain original image controls; pages 4+ use generated image-based normal/selected controls."

      - name: Verify landscape and rotation-stability settings
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=/tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio/app/AndroidManifest.xml
          grep -F 'android:screenOrientation="sensorLandscape"' "$MANIFEST"
          grep -F 'android:configChanges="orientation|screenSize"' "$MANIFEST"
          echo "Landscape orientation and screen-size change handling are present."

      - name: Render central Senki artwork
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          ART="$GITHUB_WORKSPACE/artwork"
          GAME="/tmp/narutosenki-candidate/projects/NarutoSenki"
          APPRES="$GAME/proj.android-studio/app/res"
          # The upstream XML has line-ending differences in some clones; patch the exact color value robustly here.
          sed -i 's/#ECE342/#10172A/' "$APPRES/values/ic_launcher_background.xml"
          grep -F '<color name="ic_launcher_background">#10172A</color>' "$APPRES/values/ic_launcher_background.xml"
          rsvg-convert -w 1280 -h 720 "$ART/senki-loading.svg" -o "$GAME/Resources/senki_loading.png"
          for entry in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            dir="$APPRES/mipmap-$density"
            test -d "$dir"
            rsvg-convert -w "$size" -h "$size" "$ART/senki-launcher.svg" -o "$dir/ic_launcher.png"
            rsvg-convert -w "$size" -h "$size" "$ART/senki-launcher.svg" -o "$dir/ic_launcher_round.png"
          done
          for entry in "mdpi:108" "hdpi:162" "xhdpi:216" "xxhdpi:324" "xxxhdpi:432"; do
            density="${entry%%:*}"
            size="${entry##*:}"
            dir="$APPRES/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" "$ART/senki-launcher-foreground.svg" -o "$dir/ic_launcher_foreground.png"
          done
          test -s "$GAME/Resources/senki_loading.png"
          test -s "$APPRES/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$APPRES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          file "$GAME/Resources/senki_loading.png" "$APPRES/mipmap-xxxhdpi/ic_launcher.png" "$APPRES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          echo "Original menu and character-selection backgrounds are preserved."
          echo "Rendered the editable loading screen and launcher icon into the candidate source tree."

      - name: Set up Java 17 for Android SDK provisioning
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned legacy Android SDK and NDK into an isolated SDK root
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager)"
          CLEAN_ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$CLEAN_ANDROID_HOME"
          yes | "$SDKMANAGER" --sdk_root="$CLEAN_ANDROID_HOME" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$CLEAN_ANDROID_HOME" "platforms;android-31" "build-tools;31.0.0" "platform-tools" "ndk;21.4.7075529"
          echo "ANDROID_HOME=$CLEAN_ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$CLEAN_ANDROID_HOME" >> "$GITHUB_ENV"
          echo "Installed only the pinned legacy SDK packages into an isolated root to avoid incompatible preinstalled platform metadata."

      - name: Configure SDK and NDK paths
        working-directory: /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio
        run: |
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/21.4.7075529\n' "$ANDROID_HOME" "$ANDROID_HOME" > local.properties
          chmod +x gradlew

      - name: Set up Java 8 for legacy Android Gradle Plugin
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'

      - name: Build V2 candidate (diagnostic only)
        working-directory: /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio
        run: ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Verify candidate APK exists
        if: success()
        run: |
          find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print
          test -n "$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          APK="$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F "assets/senki_loading.png"
          unzip -l "$APK" | grep -F "assets/senki_page4_off.png"
          unzip -l "$APK" | grep -F "assets/senki_page4_on.png"
          unzip -l "$APK" | grep -F "assets/senki_page5_off.png"
          unzip -l "$APK" | grep -F "assets/senki_page5_on.png"
          if unzip -Z1 "$APK" | grep -E 'assets/senki_(menu|select)[.]png$'; then
            echo "Retired custom menu/selection background replacement is still packaged."
            exit 1
          fi
          echo "Candidate APK contains the loading art and generated image-based page controls; retired custom menu/selection replacements are absent."

      - name: Verify patched package identity in APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/31.0.0/aapt" dump badging "$APK" | tee /tmp/senki-apk-badging.txt
          grep -F "name='com.senki.naruto.mod' versionCode='3' versionName='2.1.0-mod'" /tmp/senki-apk-badging.txt
          grep -F "application-label:'Naruto Senki Mod'" /tmp/senki-apk-badging.txt
          "$ANDROID_HOME/build-tools/31.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee /tmp/senki-apk-manifest.txt
          grep -F 'android:screenOrientation' /tmp/senki-apk-manifest.txt | grep -F '0x6'

      - name: Verify character search code is packaged in the APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          ENTRY="$(unzip -Z1 "$APK" | grep -E '(^|/)SelectLayer[.]lua$' | head -n 1 || true)"
          if [[ -z "$ENTRY" ]]; then
            echo "SelectLayer.lua is not present as a loose APK asset; showing matching Lua entries for diagnosis."
            unzip -Z1 "$APK" | grep -Ei 'selectlayer|lua/ui' | head -n 100 || true
            exit 1
          fi
          unzip -p "$APK" "$ENTRY" > /tmp/senki-packaged-SelectLayer.lua
          grep -F 'function SelectLayer:filterCharacters(query)' /tmp/senki-packaged-SelectLayer.lua
          grep -F 'No characters found' /tmp/senki-packaged-SelectLayer.lua
          grep -F 'width - 145' /tmp/senki-packaged-SelectLayer.lua
          echo "Character search/filter code is present in packaged SelectLayer.lua."

      - name: Verify skill-description fallback is packaged in the APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)
          ENTRY=$(unzip -Z1 "$APK" | grep -E '(^|/)SkillLayer[.]lua$' | head -n 1 || true)
          if [[ -z "$ENTRY" ]]; then
            echo "SkillLayer.lua is not present as a loose APK asset; showing matching Lua entries for diagnosis."
            unzip -Z1 "$APK" | grep -Ei 'skilllayer|lua/ui' | head -n 100 || true
            exit 1
          fi
          unzip -p "$APK" "$ENTRY" > /tmp/senki-packaged-SkillLayer.lua
          grep -F 'Skill description unavailable' /tmp/senki-packaged-SkillLayer.lua
          grep -F 'pcall(display.newSpriteFrame, imgPath)' /tmp/senki-packaged-SkillLayer.lua
          echo "Safe missing-skill-description fallback is present in packaged SkillLayer.lua."

      - name: Verify expanded form roster is packaged in the APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)"
          BASIC_ENTRY="$(unzip -Z1 "$APK" | grep -E '(^|/)basic[.]lua$' | head -n 1 || true)"
          SELECT_ENTRY="$(unzip -Z1 "$APK" | grep -E '(^|/)SelectLayer[.]lua$' | head -n 1 || true)"
          SKILL_ENTRY="$(unzip -Z1 "$APK" | grep -E '(^|/)SkillLayer[.]lua$' | head -n 1 || true)"
          test -n "$BASIC_ENTRY"
          test -n "$SELECT_ENTRY"
          test -n "$SKILL_ENTRY"
          unzip -p "$APK" "$BASIC_ENTRY" > /tmp/senki-packaged-basic.lua
          unzip -p "$APK" "$SELECT_ENTRY" > /tmp/senki-packaged-SelectLayer.lua
          unzip -p "$APK" "$SKILL_ENTRY" > /tmp/senki-packaged-SkillLayer.lua
          for form in SageJiraiya ImmortalSasuke SageNaruto RikudoNaruto RockLee Nagato; do
            grep -F "'$form'" /tmp/senki-packaged-basic.lua
            grep -F "$form = " /tmp/senki-packaged-SelectLayer.lua
            grep -F "$form = " /tmp/senki-packaged-SkillLayer.lua
          done
          grep -F 'local skillHero = skillUiAlias[self.selectHero] or self.selectHero' /tmp/senki-packaged-SkillLayer.lua
          grep -F 'local fullArtHero = skillUiAlias[self.selectHero] or self.selectHero' /tmp/senki-packaged-SkillLayer.lua
          echo "The APK contains all six extra native forms and their selection/skill UI aliases."

      - name: Verify APK signature and native ABI packaging
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f -path '*/build/outputs/apk/*/*.apk' -print -quit)
          test -n "$APK"
          "$ANDROID_HOME/build-tools/31.0.0/apksigner" verify --verbose "$APK"
          unzip -Z1 "$APK" > /tmp/senki-apk-entries.txt
          grep -E '^lib/(arm64-v8a|armeabi-v7a)/[^/]+[.]so$' /tmp/senki-apk-entries.txt > /tmp/senki-native-libs.txt
          test -s /tmp/senki-native-libs.txt
          cat /tmp/senki-native-libs.txt
          echo "APK signature verified and native Android libraries are packaged."

      - name: Upload character package audit report
        if: always() && hashFiles('character-package-audit.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: senki-character-package-audit
          path: character-package-audit.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload candidate debug APK for private testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: naruto-senki-v2-candidate-debug-apk
          path: /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Print build diagnostics on failure
        if: failure()
        run: |
          echo "Build failed. Inspect Gradle/NDK error above before changing the pinned candidate."
          find /tmp/narutosenki-candidate/projects/NarutoSenki/proj.android-studio -type f \( -name '*.log' -o -name 'hs_err_pid*.log' \) -print 2>/dev/null || true
